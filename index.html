<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🌙 Download Center - All in RAR</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: radial-gradient(circle at 50% 10%, #15112e 0%, #0a0817 60%, #030208 100%);
      color: #fff;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      padding: 40px 20px;
      position: relative;
      overflow-x: hidden;
    }
    .stars { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
    .star { position: absolute; background: #fff; border-radius: 50%; animation: twinkle linear infinite; }
    @keyframes twinkle { 0%, 100% { opacity: 0.15; transform: scale(0.8); } 50% { opacity: 0.95; transform: scale(1.2); } }
    @keyframes float { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-10px); } }

    .container { max-width: 1200px; margin: 0 auto; position: relative; z-index: 1; }
    header { text-align: center; margin-bottom: 45px; }
    header h1 {
      font-size: 2.8em;
      letter-spacing: 1px;
      background: linear-gradient(135deg, #64c8ff, #9b51e0, #ff758c);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: float 4s ease-in-out infinite;
      margin-bottom: 8px;
    }
    header p { color: rgba(255,255,255,0.7); font-size: 1.05em; }

    .files-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
      gap: 28px;
    }
    .box {
      background: rgba(255, 255, 255, 0.04);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      padding: 22px;
      border-radius: 22px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      transition: all 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      position: relative;
      display: flex;
      flex-direction: column;
    }
    .box:hover {
      transform: translateY(-8px);
      border-color: rgba(100, 200, 255, 0.5);
      box-shadow: 0 16px 35px rgba(0, 0, 0, 0.5), 0 0 25px rgba(100, 200, 255, 0.25);
      background: rgba(255, 255, 255, 0.07);
    }

    /* KHUNG ẢNH VUÔNG 1:1 */
    .logo-container {
      width: 100%;
      aspect-ratio: 1 / 1;
      margin-bottom: 18px;
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.16);
      background: #110e24;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    .logo-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.4s ease;
    }
    .box:hover .logo-container img { transform: scale(1.05); }

    .box h2 {
      font-size: 1.4em;
      margin-bottom: 6px;
      color: #fff;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .box .desc {
      font-size: 0.85em;
      color: rgba(255, 255, 255, 0.6);
      margin-bottom: 16px;
      line-height: 1.4;
    }

    .options-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 8px;
      margin-top: auto;
    }
    .options-grid.multi {
      grid-template-columns: 1fr 1fr;
    }

    .opt-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      padding: 10px 12px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      font-weight: 600;
      font-size: 0.82em;
      cursor: pointer;
      color: #fff;
      text-decoration: none;
      transition: all 0.25s ease;
      background: rgba(255, 255, 255, 0.08);
      text-align: center;
    }
    .opt-btn:hover {
      transform: translateY(-2px);
      filter: brightness(1.25);
      box-shadow: 0 4px 14px rgba(0,0,0,0.35);
    }
    .opt-btn:active { transform: scale(0.96); }

    .tag-py   { background: linear-gradient(135deg, rgba(53,114,165,0.45), rgba(255,212,59,0.35)); border-color: rgba(53,114,165,0.7); }
    .tag-exe  { background: linear-gradient(135deg, rgba(0,120,215,0.45), rgba(0,210,255,0.35)); border-color: rgba(0,120,215,0.7); }
    .tag-mac  { background: linear-gradient(135deg, rgba(160,160,160,0.4), rgba(230,230,230,0.25)); border-color: rgba(255,255,255,0.6); }
    .tag-apk  { background: linear-gradient(135deg, rgba(61,220,132,0.45), rgba(15,157,88,0.35)); border-color: rgba(61,220,132,0.7); }
    .tag-ipa  { background: linear-gradient(135deg, rgba(235,77,75,0.45), rgba(104,109,224,0.35)); border-color: rgba(235,77,75,0.7); }
    .tag-user { background: linear-gradient(135deg, rgba(230,81,0,0.45), rgba(255,167,38,0.35)); border-color: rgba(255,152,0,0.7); }
    .tag-mix  { background: linear-gradient(135deg, rgba(142,68,173,0.5), rgba(233,30,99,0.4)); border-color: rgba(156,39,176,0.8); }
    .tag-gear { background: linear-gradient(135deg, rgba(108,117,125,0.45), rgba(73,80,87,0.35)); border-color: rgba(173,181,189,0.5); }

    .modal {
      display: none; position: fixed; z-index: 1000;
      left: 0; top: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.85); backdrop-filter: blur(8px);
      animation: fadeIn 0.25s;
    }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    .modal-content {
      background: #17142b; border: 1px solid rgba(100, 200, 255, 0.3);
      margin: 14% auto; padding: 30px; border-radius: 24px;
      width: 90%; max-width: 440px; text-align: center;
      box-shadow: 0 20px 60px rgba(0,0,0,0.7);
    }
    .modal-icon { font-size: 3em; margin-bottom: 12px; }
    .modal-content h2 { margin-bottom: 10px; font-size: 1.5em; }
    .modal-content p { margin-bottom: 22px; color: rgba(255,255,255,0.75); font-size: 0.95em; }
    .modal-btns { display: flex; gap: 12px; justify-content: center; }
    .modal-btn {
      padding: 12px 26px; border: none; border-radius: 20px;
      font-weight: 700; font-size: 0.95em; cursor: pointer; transition: all 0.25s;
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    }
    .btn-confirm { background: #64c8ff; color: #0b1021; }
    .btn-confirm:hover { background: #9fe2ff; transform: scale(1.04); }
    .btn-cancel { background: rgba(255,255,255,0.12); color: #fff; }
    .spinner {
      display: inline-block; width: 16px; height: 16px;
      border: 2px solid rgba(0,0,0,0.3); border-top-color: #000;
      border-radius: 50%; animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="stars" id="stars"></div>
  <div class="container">
    <header>
      <h1>🌙 Download Center</h1>
    </header>
    <div class="files-grid" id="filesGrid"></div>
  </div>

  <div id="downloadModal" class="modal">
    <div class="modal-content">
      <div id="modalIcon" class="modal-icon">📦</div>
      <h2 id="modalTitle">Tải gói tài nguyên</h2>
      <p id="modalDesc">Chuẩn bị kết nối máy chủ...</p>
      <div class="modal-btns">
        <button class="modal-btn btn-confirm" id="confirmBtn" onclick="confirmDownload()">
          <span id="loadingIcon" class="spinner" style="display:none;"></span>
          <span id="confirmText">Tải về (.rar)</span>
        </button>
        <button class="modal-btn btn-cancel" onclick="closeModal()">Đóng</button>
      </div>
    </div>
  </div>

  <script>
    const _0x4d3f = 'aHR0cHM6Ly9kb3dubG9hZC5wbGFudHNrYWxhbjEyMy53b3JrZXJzLmRldg==';
    function wz() { return atob(_0x4d3f); }

    let selectedDownload = null;

    const TAG_INFO = {
      'py':   { label: 'Python',       icon: '🐍', cls: 'tag-py' },
      'exe':  { label: 'App exe',      icon: '⚡', cls: 'tag-exe' },
      'mac':  { label: 'macOS App',    icon: '🍏', cls: 'tag-mac' },
      'apk':  { label: 'Android apk',  icon: '🤖', cls: 'tag-apk' },
      'ipa':  { label: 'iOS ipa',      icon: '🍎', cls: 'tag-ipa' },
      'user': { label: 'Userscript',   icon: '📜', cls: 'tag-user' },
      'mix':  { label: 'Kết hợp code', icon: '📦', cls: 'tag-mix' },
      'gear': { label: 'Unknown',      icon: '⚙️', cls: 'tag-gear' }
    };

    function resolveTagInfo(tagStr) {
      if (!tagStr) return TAG_INFO['gear'];
      const rawTags = tagStr.toLowerCase().split(/[+,]/).map(t => t.trim()).filter(Boolean);
      
      if (rawTags.length === 0) return TAG_INFO['gear'];
      
      if (rawTags.length === 1) {
        return TAG_INFO[rawTags[0]] || TAG_INFO['gear'];
      }

      const icons = rawTags.map(t => (TAG_INFO[t] ? TAG_INFO[t].icon : '')).join('');
      const labels = rawTags.map(t => (TAG_INFO[t] ? TAG_INFO[t].label : t)).join(' + ');
      
      return {
        label: `Kết hợp: ${labels}`,
        icon: icons ? icons : '📦',
        cls: 'tag-mix'
      };
    }

    function createStars() {
      const container = document.getElementById('stars');
      for (let i = 0; i < 90; i++) {
        const star = document.createElement('div');
        star.className = 'star';
        const size = Math.random() * 2.5 + 1;
        star.style.width = size + 'px';
        star.style.height = size + 'px';
        star.style.left = (Math.random() * 100) + '%';
        star.style.top = (Math.random() * 100) + '%';
        star.style.animationDuration = (Math.random() * 4 + 2) + 's';
        star.style.animationDelay = (Math.random() * 3) + 's';
        container.appendChild(star);
      }
    }

    function generateSquareSvg(name) {
      const colors = [
        ['#3a1c71', '#d76d77', '#ffaf7b'],
        ['#1f4037', '#99f2c8', '#2c5364'],
        ['#0f2027', '#203a43', '#2c5364'],
        ['#2c3e50', '#3498db', '#2980b9'],
        ['#8e2de2', '#4a00e0', '#651fff'],
        ['#c31432', '#240b36', '#4a0e4e']
      ];
      let hash = 0;
      for (let i = 0; i < name.length; i++) hash = name.charCodeAt(i) + ((hash << 5) - hash);
      const colorPair = colors[Math.abs(hash) % colors.length];
      const initials = (name.replace(/[^a-zA-Z0-9]/g, '').slice(0, 2) || 'DL').toUpperCase();

      const svg = `
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
        <defs>
          <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="${colorPair[0]}"/>
            <stop offset="50%" stop-color="${colorPair[1]}"/>
            <stop offset="100%" stop-color="${colorPair[2]}"/>
          </linearGradient>
          <radialGradient id="glow" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25"/>
            <stop offset="100%" stop-color="#000000" stop-opacity="0.65"/>
          </radialGradient>
        </defs>
        <rect width="400" height="400" rx="36" fill="url(#grad)"/>
        <circle cx="200" cy="200" r="150" fill="url(#glow)"/>
        <path d="M 60 100 L 140 100 L 170 130" stroke="rgba(255,255,255,0.22)" stroke-width="3" fill="none"/>
        <path d="M 340 300 L 260 300 L 230 270" stroke="rgba(255,255,255,0.22)" stroke-width="3" fill="none"/>
        <circle cx="60" cy="100" r="6" fill="#fff" opacity="0.6"/>
        <circle cx="340" cy="300" r="6" fill="#fff" opacity="0.6"/>
        <text x="50%" y="54%" font-family="system-ui, sans-serif" font-size="95" font-weight="900" fill="#ffffff" text-anchor="middle" dominant-baseline="middle" letter-spacing="4" filter="drop-shadow(0px 8px 14px rgba(0,0,0,0.6))">${initials}</text>
        <rect x="125" y="275" width="150" height="30" rx="15" fill="rgba(0,0,0,0.4)" stroke="rgba(255,255,255,0.3)" stroke-width="1.5"/>
        <text x="50%" y="295" font-family="system-ui" font-size="12" font-weight="700" fill="#64c8ff" text-anchor="middle">VERIFIED PACKAGE</text>
      </svg>`;
      return 'data:image/svg+xml;utf8,' + encodeURIComponent(svg);
    }

    function groupFiles(rawFiles) {
      const groups = {};
      rawFiles.forEach(file => {
        const cleanName = (file.name || file.id).replace(/\.(rar|zip)$/i, '').trim();
        const groupKey = cleanName.toLowerCase();

        if (!groups[groupKey]) {
          groups[groupKey] = {
            displayName: cleanName,
            cover: file.cover || '',
            options: []
          };
        }
        if (!groups[groupKey].cover && file.cover) {
          groups[groupKey].cover = file.cover;
        }

        const tagMeta = resolveTagInfo(file.tag);

        groups[groupKey].options.push({
          id: file.id,
          filename: file.filename || file.name,
          tag: file.tag || 'gear',
          label: tagMeta.label,
          icon: tagMeta.icon,
          cls: tagMeta.cls
        });
      });
      return Object.values(groups);
    }

    function renderCards(data) {
      const grid = document.getElementById('filesGrid');
      if (!data || data.length === 0) {
        grid.innerHTML = '<p style="text-align:center;grid-column:1/-1;">Chưa có tệp khả dụng.</p>';
        return;
      }

      const groupedCards = groupFiles(data);

      grid.innerHTML = groupedCards.map(group => {
        const coverSrc = group.cover && group.cover.trim() !== '' ? group.cover : generateSquareSvg(group.displayName);
        const isMulti = group.options.length > 1;

        const optionsHtml = group.options.map(opt => `
          <button class="opt-btn ${opt.cls}" onclick="triggerDownload('${opt.id}', '${group.displayName}', '${opt.filename}', '${opt.label}', '${opt.icon}')">
            <span>${opt.icon}</span><span>${opt.label}</span>
          </button>
        `).join('');

        return `
          <div class="box">
            <div class="logo-container">
              <img src="${coverSrc}" alt="${group.displayName}" onerror="this.onerror=null; this.src=generateSquareSvg('${group.displayName}');">
            </div>
            <h2>${group.displayName}</h2>
            <div class="desc">Bản nén .RAR chính thức cho ${group.displayName}</div>
            <div class="options-grid ${isMulti ? 'multi' : ''}">
              ${optionsHtml}
            </div>
          </div>
        `;
      }).join('');
    }

    function triggerDownload(id, webName, filename, label, icon) {
      selectedDownload = { id, filename };
      document.getElementById('modalIcon').textContent = icon;
      document.getElementById('modalTitle').textContent = `Tải ${label}`;
      document.getElementById('modalDesc').innerHTML = `Gói: <strong>${webName}</strong><br>Tệp tải về: <code>${filename}</code>`;
      document.getElementById('downloadModal').style.display = 'block';
    }

    function closeModal() {
      document.getElementById('downloadModal').style.display = 'none';
      selectedDownload = null;
      document.getElementById('confirmText').textContent = 'Tải về (.rar)';
      document.getElementById('loadingIcon').style.display = 'none';
    }

    function confirmDownload() {
      if (!selectedDownload) return;
      
      const confirmText = document.getElementById('confirmText');
      const loadingIcon = document.getElementById('loadingIcon');
      confirmText.textContent = 'Đang chuyển hướng tải...';
      loadingIcon.style.display = 'inline-block';

      try {
        const directUrl = `${wz()}/d/${selectedDownload.id}`;
        const tempAnchor = document.createElement('a');
        tempAnchor.style.display = 'none';
        tempAnchor.href = directUrl;
        tempAnchor.setAttribute('download', selectedDownload.filename);
        document.body.appendChild(tempAnchor);
        tempAnchor.click();

        setTimeout(() => {
          document.body.removeChild(tempAnchor);
          closeModal();
        }, 500);
      } catch (err) {
        alert('Lỗi khởi tạo link tải!');
        closeModal();
      }
    }

    window.onclick = function(e) {
      if (e.target === document.getElementById('downloadModal')) closeModal();
    };

    function initApp(filesData) {
      createStars();
      renderCards(filesData);
    }

    document.addEventListener('contextmenu', e => e.preventDefault());
    document.onkeydown = function(e) {
      if (e.keyCode === 123 || (e.ctrlKey && e.shiftKey && e.keyCode === 73)) return false;
    };
  </script>
